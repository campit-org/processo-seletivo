services:
  banco:
    image: postgres:17.6-alpine
    container_name: pedal-certo-banco
    environment:
      POSTGRES_DB: pedal_certo
      POSTGRES_USER: pedal_certo
      # Senha só para uso local; o banco sobe com dados fictícios.
      POSTGRES_PASSWORD: pedal_certo
      TZ: America/Sao_Paulo
    ports:
      - "${PEDAL_CERTO_PORTA:-5432}:5432"
    volumes:
      - ./dump:/docker-entrypoint-initdb.d:ro
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pedal_certo -d pedal_certo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dados:
